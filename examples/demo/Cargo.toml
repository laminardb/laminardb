[workspace]

[package]
name = "laminardb-demo"
version = "0.28.0"
edition = "2021"
publish = false
description = "Market Data Demo: Real-time analytics with Ratatui TUI for LaminarDB"

[lib]
name = "laminardb_demo"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/main.rs"

[[bin]]
name = "producer"
path = "src/producer.rs"
required-features = ["kafka"]

[features]
default = []
kafka = ["laminar-db/kafka", "dep:rdkafka", "dep:serde", "dep:serde_json"]

[dependencies]
laminar-db = { path = "../../crates/laminar-db", default-features = false }
laminar-derive = { path = "../../crates/laminar-derive" }
laminar-core = { path = "../../crates/laminar-core" }

# Arrow
arrow = "=58.4.0"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"

# Async
tokio = { version = "1.50", features = ["full"] }

# Utilities
chrono = "0.4"
rand = "0.10"

# TUI
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"

# System metrics
sysinfo = "0.38"

# Kafka (optional)
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
