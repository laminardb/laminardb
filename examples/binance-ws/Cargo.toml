[workspace]

[package]
name = "binance-ws"
version = "0.28.0"
edition = "2021"
publish = false
description = "Binance VWAP signals: minimal LaminarDB streaming example"

[[bin]]
name = "binance-ws"
path = "src/main.rs"

[dependencies]
laminar-db = { path = "../../crates/laminar-db", default-features = false, features = ["websocket"] }
laminar-derive = { path = "../../crates/laminar-derive" }
arrow = "=58.4.0"
tokio = { version = "1.50", features = ["full"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["all-widgets"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
