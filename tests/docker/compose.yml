# Docker Compose for integration tests that require external systems.
#
# Bring up:   docker compose -f tests/docker/compose.yml up -d
# Tear down:  docker compose -f tests/docker/compose.yml down
#
# Kafka tests gate on a metadata request to `127.0.0.1:19092`; they
# skip gracefully when the broker is unavailable.
#
# Port 19092 is the host-side Kafka advertisement. Keep it in sync with
# the `KAFKA_BROKERS` constant in `crates/laminar-db/tests/common/kafka.rs`.

services:
  seaweedfs:
    # S3-compatible store for the fault soaks. It honours the conditional create and update
    # requests that checkpoint, lease, and exactly-once Delta commits depend on.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: laminardb-seaweedfs
    ports:
      - "19000:8333"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: laminardb-azurite
    env_file:
      - azurite-test.env
    ports:
      - "127.0.0.1:10000:10000"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --disableTelemetry --skipApiVersionCheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  gcs-emulator:
    # The pinned object_store XML client requires the upstream test image's XML API fixes.
    image: tustvold/fake-gcs-server@sha256:dcd3aeacc07c731f1336e90c2889be2af8626ae993ee1fe2c0ba042ebbeb5a04
    container_name: laminardb-gcs-emulator
    ports:
      - "127.0.0.1:4443:4443"
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "127.0.0.1:4443"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4443/storage/v1/b"]
      interval: 2s
      timeout: 2s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.13
    container_name: laminardb-redpanda
    ports:
      - "127.0.0.1:19092:19092"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:19092
      - --node-id=0
      - --check=false
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "-e", "-X", "brokers=127.0.0.1:19092"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: laminardb-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 30

  # IBM MQ Advanced for Developers (non-production developer license; amd64-only image).
  # Opt in with `--profile ibmmq` and IBM_MQ_LICENSE=accept after reading the license
  # (`docker run --rm icr.io/ibm-messaging/mq:9.4.0.26-r2 --license`). On Apple silicon,
  # also pass `-f tests/docker/ibmmq-rosetta.compose.yml` (see that file for why).
  ibmmq:
    image: icr.io/ibm-messaging/mq:9.4.0.26-r2
    platform: linux/amd64
    container_name: laminardb-ibmmq
    profiles: ["ibmmq"]
    ports:
      - "127.0.0.1:1414:1414"
    environment:
      # Empty unless the operator accepts: the image refuses to start without LICENSE=accept.
      LICENSE: ${IBM_MQ_LICENSE:-}
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: laminar-test-app
      MQ_ADMIN_PASSWORD: laminar-test-admin
    healthcheck:
      test: ["CMD", "chkmqstarted"]
      interval: 5s
      timeout: 10s
      retries: 40
