name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'site/**'
      - 'examples/**'
      - 'deploy/helm/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  # A release is published before its image is pushed; rebuild once the image exists so the
  # chart for that release is added (see "Publish Helm chart repository").
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler

      - name: Build API documentation
        run: cargo +nightly doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      # Build user guide if mdBook exists
      - name: Setup mdBook
        if: hashFiles('docs/book.toml') != ''
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build user guide
        if: hashFiles('docs/book.toml') != ''
        run: mdbook build docs

      - name: Prepare site structure
        run: |
          # Start with the existing landing page from the repo
          cp -r site/ _site/

          # Add API docs under /api/
          cp -r target/doc _site/api

          # Create redirect for api root → main crate docs
          cat > _site/api/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0; url=laminar_db/"></head>
          <body><p>Redirecting to <a href="laminar_db/">laminar_db</a>...</p></body>
          </html>
          EOF

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Publish Helm chart repository
        # Classic Helm repo served from Pages at https://laminardb.io/charts.
        # Runs every build so the charts stay in the freshly rebuilt artifact. Each chart
        # version is a released engine version, packaged from that release's tag once its
        # image is on Docker Hub, so the chart's default image tag exists. Published chart
        # versions are immutable and carried forward from the live index.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          CHARTS_URL=https://laminardb.io/charts
          TAG="${RELEASE_TAG:-$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)}"
          case "$TAG" in
            v[0-9]*) VERSION="${TAG#v}" ;;
            *) echo "::error::release tag '$TAG' does not start with v<digit>"; exit 1 ;;
          esac
          mkdir -p _site/charts
          MERGE=()
          if curl -fsSL "$CHARTS_URL/index.yaml" -o "$RUNNER_TEMP/published-index.yaml"; then
            for chart in $(grep -oE "$CHARTS_URL/laminardb-[0-9][^\" ]*\.tgz" "$RUNNER_TEMP/published-index.yaml" | sort -u); do
              curl -fsSL "$chart" -o "_site/charts/${chart##*/}"
            done
            MERGE=(--merge "$RUNNER_TEMP/published-index.yaml")
          fi
          if [ -f "_site/charts/laminardb-${VERSION}.tgz" ]; then
            :
          elif ! curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/laminardb/laminardb-server/tags/${VERSION}"; then
            echo "::warning::laminardb/laminardb-server:${VERSION} is not on Docker Hub yet; its chart is added when the image build finishes"
          else
            git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            mkdir -p "$RUNNER_TEMP/chart-src"
            git archive "$TAG" deploy/helm/laminardb | tar -x -C "$RUNNER_TEMP/chart-src"
            CHART="$RUNNER_TEMP/chart-src/deploy/helm/laminardb"
            sed -i "s/^version:.*/version: ${VERSION}/" "$CHART/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "$CHART/Chart.yaml"
            helm package "$CHART" -d _site/charts
          fi
          helm repo index _site/charts --url "$CHARTS_URL" "${MERGE[@]}"
          ls -la _site/charts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
