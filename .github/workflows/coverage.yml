name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Job-scoped least privilege: only this job needs the OIDC scope for
    # Codecov's tokenless upload fallback.
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      # Source-based coverage reads the instrumentation maps, not DWARF; debuginfo in every
      # all-features test binary filled the runner disk.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Coverage instrumentation grows the same large async recovery test frames exercised by CI.
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@v6
      # The --all-features build under -C instrument-coverage (run 3x in this
      # job) overflowed the runner disk ("No space left on device" -> ld bus
      # error). Use the same aggressive cleanup + swap as the CI Test job.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev protobuf-compiler

      # Testcontainers pulls on first use inside the test run, where one dropped registry
      # stream fails that test ("bytes remaining on stream"); pull up front with retries.
      - name: Pre-pull integration test images
        run: |
          for image in mongo:8.0 postgres:11-alpine postgres:18 \
              redpandadata/redpanda:v24.3.1 minio/minio:latest; do
            for attempt in 1 2 3; do
              docker pull --quiet "$image" && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 10))
            done
          done

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex 'tests?\.rs$|benches?/' \
            --lcov --output-path lcov.info

      - name: Generate HTML report
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex 'tests?\.rs$|benches?/' \
            --html --output-dir coverage-html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/

      - name: Coverage summary
        run: |
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex 'tests?\.rs$|benches?/' \
            2>&1 | tail -30 >> $GITHUB_STEP_SUMMARY || true
