name: Checkpoint fault and soak

# Process-death and coordinated-recovery soaks. Expensive and timing-sensitive, so they run weekly
# (and on demand) rather than on the per-PR critical path. Embedded mode uses the built-in generator;
# cluster jobs use Redpanda plus MinIO for replayable partitions and cluster-shared durability.
on:
  workflow_dispatch:
    inputs:
      kills:
        description: "kill -9 rounds (LAMINAR_SOAK_KILLS)"
        required: false
        default: "4"
      seconds:
        description: "soak duration seconds (LAMINAR_SOAK_SECONDS)"
        required: false
        default: "120"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  embedded-group-demotion:
    name: Embedded kill-9 group-demotion soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: state-tier-soak
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      # Default-ON embedded path: bound RAM via group demotion, validate kill-9 recovery of demoted
      # groups from the cold-only per-vnode partials. The test self-configures embedded mode with
      # group demotion ON + a local FS backend (built-in generator, no external services).
      - name: Embedded kill-9 group-demotion soak
        run: cargo test -p laminar-server --no-default-features --features state-tier --test cluster_soak embedded_kill9_group_demotion_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}

      - name: Upload embedded node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-kill9-logs
          path: target/tmp/**/soak-embed-*/*.log
          if-no-files-found: warn
          retention-days: 14

  cluster-kill9:
    name: Three-node cluster kill-9 soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-cluster-kill9
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Kill leader and followers during in-flight checkpoints
        run: cargo test -p laminar-server --no-default-features --features "cluster,aws,kafka" --test cluster_soak three_node_kill9_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/kill9/checkpoints
          LAMINAR_SOAK_STATE_URL: s3://laminardb-soak/${{ github.run_id }}/kill9/state
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload cluster node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-kill9-logs
          path: target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v

  cluster-coordinated-recovery:
    name: Coordinated recovery (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: leader
          - role: follower
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-cluster-recovery-${{ matrix.role }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Inject a fatal pipeline cycle fault on the ${{ matrix.role }}
        run: cargo test -p laminar-server --no-default-features --features "cluster,aws,kafka" --test cluster_soak three_node_kill9_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: "0"
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_FAULT_INJECT_ROLE: ${{ matrix.role }}
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/recovery-${{ matrix.role }}/checkpoints
          LAMINAR_SOAK_STATE_URL: s3://laminardb-soak/${{ github.run_id }}/recovery-${{ matrix.role }}/state
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload coordinated-recovery node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-recovery-${{ matrix.role }}-logs
          path: target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v
