name: Checkpoint fault and soak

# Process-death and coordinated-recovery soaks. Expensive and timing-sensitive, so they run weekly
# (and on demand) rather than on the per-PR critical path. Cluster jobs use Redpanda plus MinIO for
# replayable partitions and cluster-shared durability.
on:
  workflow_dispatch:
    inputs:
      kills:
        description: "kill -9 rounds (LAMINAR_SOAK_KILLS)"
        required: false
        default: "4"
      seconds:
        description: "steady-soak seconds after fault rounds (LAMINAR_SOAK_SECONDS)"
        required: false
        default: "120"
      recovery_ms:
        description: "per failover/rejoin ceiling in milliseconds (1..90000)"
        required: false
        default: "90000"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  local-exact-kill9:
    name: Single-node exact source/state kill-9 soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-local-exact-kill9
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Kill and restart exact single-node source/state recovery
        # `cluster` compiles the debug-only checkpoint kill gate; runtime mode remains `single`.
        run: cargo test --profile soak -p laminar-server --no-default-features --features cluster --test cluster_soak local_exact_source_state_kill9_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}

      - name: Upload local node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-exact-kill9-logs
          path: target/tmp/**/soak-local-exact-*/*.log
          if-no-files-found: warn
          retention-days: 14

  cluster-kill9:
    name: Three-node cluster kill-9 soak (${{ matrix.discovery }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        discovery: [gossip, static]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-cluster-kill9-${{ matrix.discovery }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Verify Kafka global source handoff
        if: matrix.discovery == 'static'
        run: cargo test --profile soak -p laminar-connectors --no-default-features --features kafka --test kafka_global_drain -- --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_KAFKA_BROKERS: 127.0.0.1:19092

      - name: Kill leader and followers during in-flight checkpoints
        run: cargo test --profile soak -p laminar-server --no-default-features --features "cluster,aws,kafka" --test cluster_soak three_node_kill9_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}
          LAMINAR_SOAK_DISCOVERY: ${{ matrix.discovery }}
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/kill9-${{ matrix.discovery }}/checkpoints
          LAMINAR_SOAK_STATE_URL: s3://laminardb-soak/${{ github.run_id }}/kill9-${{ matrix.discovery }}/state
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload cluster node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-kill9-${{ matrix.discovery }}-logs
          path: target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v

  cluster-coordinated-recovery:
    name: Coordinated recovery (${{ matrix.role }}, ${{ matrix.discovery }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [leader, follower]
        discovery: [gossip, static]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-cluster-recovery-${{ matrix.role }}-${{ matrix.discovery }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Inject a fatal pipeline cycle fault on the ${{ matrix.role }}
        run: cargo test --profile soak -p laminar-server --no-default-features --features "cluster,aws,kafka" --test cluster_soak three_node_kill9_soak -- --ignored --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_SOAK_KILLS: "0"
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}
          LAMINAR_SOAK_FAULT_INJECT_ROLE: ${{ matrix.role }}
          LAMINAR_SOAK_DISCOVERY: ${{ matrix.discovery }}
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/recovery-${{ matrix.role }}-${{ matrix.discovery }}/checkpoints
          LAMINAR_SOAK_STATE_URL: s3://laminardb-soak/${{ github.run_id }}/recovery-${{ matrix.role }}-${{ matrix.discovery }}/state
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload coordinated-recovery node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-recovery-${{ matrix.role }}-${{ matrix.discovery }}-logs
          path: target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v
