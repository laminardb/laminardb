name: Checkpoint fault and soak

# Process-death and coordinated-recovery soaks. Expensive and timing-sensitive, so they run weekly
# (and on demand) rather than on the per-PR critical path. Cluster jobs use Redpanda plus MinIO for
# replayable partitions and cluster-shared durability.
on:
  workflow_dispatch:
    inputs:
      kills:
        description: "kill -9 rounds (LAMINAR_SOAK_KILLS)"
        required: false
        default: "4"
      seconds:
        description: "steady-soak seconds after fault rounds (LAMINAR_SOAK_SECONDS)"
        required: false
        default: "120"
      recovery_ms:
        description: "per failover/rejoin ceiling in milliseconds (1..90000)"
        required: false
        default: "90000"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  local-exact-kill9:
    name: Single-node exact source/state kill-9 soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-local-exact-kill9
      - name: Install system dependencies
        # apt mirror fetches have hung for a full job timeout with no output; kill stalls
        # and retry the identical package set.
        run: |
          set -euo pipefail
          packages="libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler"
          for attempt in 1 2 3 4 5; do
            if timeout 300 sudo apt-get update && sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "apt install attempt ${attempt} failed or stalled; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Kill and restart exact single-node source/state recovery
        # `cluster` compiles the debug-only checkpoint kill gate; runtime mode remains `single`.
        shell: bash
        run: |
          set -euo pipefail
          cargo test --profile soak -p laminar-server --no-default-features --features cluster --test cluster_soak "$SOAK_TEST" -- --ignored --exact --nocapture --color never 2>&1 | tee local-exact-soak.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' local-exact-soak.log
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          SOAK_TEST: local_exact_source_state_kill9_soak
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}

      - name: Upload local node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-exact-kill9-logs
          path: |
            local-exact-soak.log
            target/tmp/**/soak-local-exact-*/*.log
          if-no-files-found: warn
          retention-days: 14

  join-validity:
    name: ${{ matrix.label }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Single-node ALO stateful joins
            test: single_node_alo_join_kill9_soak
            features: cluster,kafka
            delivery: alo
            topology: single
            discovery: gossip
            emulator: "0"
            checkpoint_ms: "250"
            rps: "400"
            visibility_ms: "10000"
            slo_mode: observe
          - label: Single-node EO stateful joins
            test: single_node_eo_join_kill9_soak
            features: cluster,kafka,delta-lake-s3
            delivery: eo
            topology: single
            discovery: gossip
            emulator: "1"
            checkpoint_ms: "10000"
            rps: "250"
            visibility_ms: "90000"
            slo_mode: observe
          - label: Cluster ALO stateful joins (gossip)
            test: three_node_alo_join_kill9_soak
            features: cluster,aws,kafka
            delivery: alo
            topology: cluster
            discovery: gossip
            emulator: "0"
            checkpoint_ms: "250"
            rps: "400"
            visibility_ms: "10000"
            slo_mode: observe
          - label: Cluster ALO stateful joins (static)
            test: three_node_alo_join_kill9_soak
            features: cluster,aws,kafka
            delivery: alo
            topology: cluster
            discovery: static
            emulator: "0"
            checkpoint_ms: "250"
            rps: "400"
            visibility_ms: "10000"
            slo_mode: observe
          - label: Cluster EO stateful joins (gossip)
            test: three_node_eo_join_kill9_soak
            features: cluster,aws,kafka,delta-lake-s3
            delivery: eo
            topology: cluster
            discovery: gossip
            emulator: "1"
            checkpoint_ms: "10000"
            rps: "150"
            visibility_ms: "120000"
            slo_mode: observe
          - label: Cluster EO stateful joins (static)
            test: three_node_eo_join_kill9_soak
            features: cluster,aws,kafka,delta-lake-s3
            delivery: eo
            topology: cluster
            discovery: static
            emulator: "1"
            checkpoint_ms: "10000"
            rps: "150"
            visibility_ms: "120000"
            slo_mode: observe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-join-${{ matrix.topology }}-${{ matrix.delivery }}-${{ matrix.discovery }}
      - name: Install system dependencies
        # apt mirror fetches have hung for a full job timeout with no output; kill stalls
        # and retry the identical package set.
        run: |
          set -euo pipefail
          packages="libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler"
          for attempt in 1 2 3 4 5; do
            if timeout 300 sudo apt-get update && sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "apt install attempt ${attempt} failed or stalled; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Verify Kafka global source handoff
        if: matrix.discovery == 'static' && matrix.delivery == 'alo'
        run: cargo test --profile soak -p laminar-connectors --no-default-features --features "kafka,testing" --test kafka_global_drain -- --nocapture
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_KAFKA_BROKERS: 127.0.0.1:19092

      - name: Run stateful join validity soak
        shell: bash
        run: |
          set -euo pipefail
          cargo test --profile soak -p laminar-server --no-default-features --features "$SOAK_FEATURES" --test cluster_soak "$SOAK_TEST" -- --ignored --exact --nocapture --color never 2>&1 | tee join-soak.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' join-soak.log
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          SOAK_FEATURES: ${{ matrix.features }}
          SOAK_TEST: ${{ matrix.test }}
          LAMINAR_SOAK_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SINGLE_KILLS: ${{ github.event.inputs.kills || '4' }}
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          # MinIO EO is protocol validation, not a throughput certificate. Use the production
          # 10s checkpoint cadence and a load that still exceeds the 8 MiB state floor. Cluster EO
          # gets a bounded drain window for fault-built backlog across 23 emulator-backed sinks;
          # the test's strict defaults remain the certifying profile for production object stores.
          LAMINAR_SOAK_INTERVAL_MS: ${{ matrix.checkpoint_ms }}
          LAMINAR_SOAK_CHECKPOINT_SLO_MODE: ${{ matrix.slo_mode }}
          LAMINAR_SOAK_EO_VISIBILITY_MS: ${{ matrix.visibility_ms }}
          LAMINAR_SOAK_JOIN_INTERVAL_MS: "15000"
          LAMINAR_SOAK_JOIN_KEYS: "65536"
          LAMINAR_SOAK_ZIPF_MILLI: "800"
          LAMINAR_SOAK_RPS: ${{ matrix.rps }}
          # Blacksmith CPU generations produced a repeatable 3x spread for identical binaries.
          # Use a 10/50ms runner envelope here; pinned target hardware keeps the strict defaults.
          LAMINAR_SOAK_HOT_P50_MS: "10"
          LAMINAR_SOAK_HOT_P95_MS: "50"
          LAMINAR_SOAK_HOT_P99_MS: "50"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}
          LAMINAR_SOAK_MIN_LIVE_STATE_BYTES: "8388608"
          LAMINAR_SOAK_DISCOVERY: ${{ matrix.discovery }}
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/${{ matrix.topology }}-${{ matrix.delivery }}-${{ matrix.discovery }}/checkpoints
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_DELTA_BUCKET: laminardb-soak
          LAMINAR_SOAK_ALLOW_S3_EMULATOR: ${{ matrix.emulator }}
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload join soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-${{ matrix.topology }}-${{ matrix.delivery }}-${{ matrix.discovery }}-logs
          path: |
            join-soak.log
            target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v

  cluster-coordinated-recovery:
    name: Coordinated recovery (${{ matrix.role }}, ${{ matrix.discovery }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 16
    strategy:
      fail-fast: false
      matrix:
        role: [leader, follower]
        discovery: [gossip, static]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checkpoint-cluster-recovery-${{ matrix.role }}-${{ matrix.discovery }}
      - name: Install system dependencies
        # apt mirror fetches have hung for a full job timeout with no output; kill stalls
        # and retry the identical package set.
        run: |
          set -euo pipefail
          packages="libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler"
          for attempt in 1 2 3 4 5; do
            if timeout 300 sudo apt-get update && sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "apt install attempt ${attempt} failed or stalled; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start cluster-shared dependencies
        run: |
          docker compose -f tests/docker/compose.yml up -d --wait --wait-timeout 60 minio redpanda
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set local http://127.0.0.1:19000 laminar laminar-test-secret && mc mb --ignore-existing local/laminardb-soak'

      - name: Inject a fatal pipeline cycle fault on the ${{ matrix.role }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --profile soak -p laminar-server --no-default-features --features "cluster,aws,kafka" --test cluster_soak "$SOAK_TEST" -- --ignored --exact --nocapture --color never 2>&1 | tee coordinated-recovery-soak.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' coordinated-recovery-soak.log
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          SOAK_TEST: three_node_alo_join_kill9_soak
          LAMINAR_SOAK_KILLS: "0"
          LAMINAR_SOAK_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          LAMINAR_SOAK_INTERVAL_MS: "250"
          # Blacksmith is not pinned target hardware. Preserve exact timing evidence here without
          # claiming production latency certification; the test default remains `certify`.
          LAMINAR_SOAK_CHECKPOINT_SLO_MODE: observe
          LAMINAR_SOAK_JOIN_INTERVAL_MS: "15000"
          LAMINAR_SOAK_JOIN_KEYS: "65536"
          LAMINAR_SOAK_ZIPF_MILLI: "800"
          LAMINAR_SOAK_RPS: "400"
          # Blacksmith CPU generations produced a repeatable 3x spread for identical binaries.
          # Use a 10/50ms runner envelope here; pinned target hardware keeps the strict defaults.
          LAMINAR_SOAK_HOT_P50_MS: "10"
          LAMINAR_SOAK_HOT_P95_MS: "50"
          LAMINAR_SOAK_HOT_P99_MS: "50"
          LAMINAR_SOAK_MAX_RECOVERY_MS: ${{ github.event.inputs.recovery_ms || '90000' }}
          LAMINAR_SOAK_MIN_LIVE_STATE_BYTES: "8388608"
          LAMINAR_SOAK_FAULT_INJECT_ROLE: ${{ matrix.role }}
          LAMINAR_SOAK_DISCOVERY: ${{ matrix.discovery }}
          LAMINAR_SOAK_CHECKPOINT_URL: s3://laminardb-soak/${{ github.run_id }}/recovery-${{ matrix.role }}-${{ matrix.discovery }}/checkpoints
          LAMINAR_SOAK_S3_ENDPOINT: http://127.0.0.1:19000
          LAMINAR_SOAK_S3_ACCESS_KEY: laminar
          LAMINAR_SOAK_S3_SECRET_KEY: laminar-test-secret
          LAMINAR_SOAK_S3_REGION: us-east-1
          LAMINAR_SOAK_KAFKA_SOURCE_BROKERS: 127.0.0.1:19092

      - name: Upload coordinated-recovery node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-recovery-${{ matrix.role }}-${{ matrix.discovery }}-logs
          path: |
            coordinated-recovery-soak.log
            target/tmp/**/soak-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print dependency diagnostics on failure
        if: failure()
        run: |
          docker compose -f tests/docker/compose.yml ps -a
          docker compose -f tests/docker/compose.yml logs minio redpanda
          docker inspect --format '{{json .State.Health}}' laminardb-redpanda || true

      - name: Stop cluster-shared dependencies
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v
