name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

# Cancel redundant runs: when pushing multiple commits quickly or when
# both push and PR events fire for the same commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce debug info to speed up builds and linking
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Disable incremental compilation in CI to reduce disk usage
  CARGO_INCREMENTAL: 0
  # Limit parallel compiler jobs to avoid OOM on GitHub Actions runners (7 GB RAM)
  CARGO_BUILD_JOBS: 2

jobs:
  # ============================================
  # Formatting Check (fast, no deps)
  # ============================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check
      - name: Readability review baseline
        run: cargo +nightly run --quiet --manifest-path tools/readability-check/Cargo.toml -- .

  # ============================================
  # Clippy Lints
  # ============================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      - name: Clippy (no default features)
        run: cargo clippy --workspace --no-default-features -- -D warnings
      - name: Clippy (readability check)
        run: cargo clippy --manifest-path tools/readability-check/Cargo.toml --all-targets -- -D warnings

  # ============================================
  # Build & Test (Multi-Platform)
  # ============================================
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@nextest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Tests include compilation - no separate build step needed
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --all-features
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      # Windows: explicit features (default set, with vendored OpenSSL)
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --features "kafka,postgres-cdc,postgres-sink,mongodb-cdc,delta-lake,delta,files,parquet-lookup"

      # Doc tests only on Linux (redundant across platforms)
      - name: Run doc tests
        if: runner.os == 'Linux'
        run: cargo test --doc --workspace

  # ============================================
  # PostgreSQL CDC Compatibility
  # ============================================
  postgres-cdc-integration:
    name: PostgreSQL CDC (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-cdc-${{ matrix.postgres }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler
      - name: Run PostgreSQL CDC integration tests
        run: cargo test -p laminar-connectors --no-default-features --features postgres-cdc --test postgres_cdc_integration -- --test-threads=1 --nocapture
        env:
          LAMINAR_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # ============================================
  # Release Build (main/develop only)
  # ============================================
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    # Only run on main/develop to save CI time on PRs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler
      - name: Build release
        run: cargo build --workspace --release --all-features
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # ============================================
  # Feature Combinations
  # ============================================
  features:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler

      - name: Check no default features
        run: cargo check --workspace --no-default-features

      - name: Check all features
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Check individual features
        run: |
          # Core features
          cargo check -p laminar-core --no-default-features
          cargo check -p laminar-core --no-default-features --features cluster

          # DB features
          cargo check -p laminar-db --no-default-features --features cluster

          # Connector features
          cargo check -p laminar-connectors --no-default-features
          cargo check -p laminar-connectors --no-default-features --features kafka
          cargo check -p laminar-connectors --no-default-features --features postgres-cdc
          cargo check -p laminar-connectors --no-default-features --features postgres-sink
          cargo check -p laminar-connectors --no-default-features --features mongodb-cdc
          cargo check -p laminar-connectors --no-default-features --features files
          cargo check -p laminar-connectors --no-default-features --features parquet-lookup

  dependency-generations:
    name: Analytical Dependency Generations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reject divergent analytical dependency generations
        run: python3 tools/check_analytical_dependencies.py
      - name: Verify maintained fork packages can be assembled
        run: |
          cargo package --manifest-path vendor/pgwire/Cargo.toml --no-verify
          cargo package --manifest-path vendor/pgwire-replication/Cargo.toml --no-verify
      - name: Verify workspace packages can be assembled
        run: |
          # The release publishes both maintained forks before the Laminar crates.
          cargo package --workspace --locked --no-verify \
            --config 'patch.crates-io.laminardb-pgwire.path="vendor/pgwire"' \
            --config 'patch.crates-io.laminardb-pgwire-replication.path="vendor/pgwire-replication"'

  # ============================================
  # MSRV Check
  # ============================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract MSRV
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | cut -d'"' -f2 || echo "1.95")
          if [[ -z "$MSRV" ]]; then
            MSRV="1.95"
          fi
          echo "MSRV: $MSRV"
          echo "version=$MSRV" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev protobuf-compiler
      - run: cargo check --workspace

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libudev-dev mold protobuf-compiler
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # ============================================
  # Security Audit
  # ============================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        continue-on-error: true  # Advisory only until deps stabilize

  # ============================================
  # Dependency Licenses
  # ============================================
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace
        continue-on-error: true  # Advisory only until deny.toml is tuned

  # ============================================
  # Miri (Unsafe Code Verification)
  # ============================================
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Only run on main/develop to save CI time
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Setup Miri
        run: cargo +nightly miri setup
      - name: Run Miri on core
        run: |
          cargo +nightly miri test -p laminar-core --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        continue-on-error: true

  # ============================================
  # Independent Evidence Contract Scaffolds
  # ============================================
  soak-contract-scaffold:
    name: Ineligible contract/model scaffolds (NOT evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - name: Format standalone contract tool
        run: cargo fmt --manifest-path tools/independent-soak-contract/Cargo.toml -- --check
      - name: Lint standalone contract tool
        run: cargo clippy --locked --manifest-path tools/independent-soak-contract/Cargo.toml --all-targets -- -D warnings
      - name: Test standalone contract tool
        run: cargo test --locked --manifest-path tools/independent-soak-contract/Cargo.toml
      - name: Reject Laminar, path, and workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          manifest=tools/independent-soak-contract/Cargo.toml
          if grep -Eq '(path|workspace)[[:space:]]*=' "$manifest"; then
            echo "standalone soak contract unexpectedly uses a path or workspace dependency"
            exit 1
          fi
          dependency_tree="$(cargo tree --locked --manifest-path tools/independent-soak-contract/Cargo.toml --prefix none)"
          if grep -Eq '^laminar[-_]' <<< "$dependency_tree"; then
            echo "standalone soak contract unexpectedly depends on a Laminar package"
            exit 1
          fi
      - name: Validate ineligible draft and golden oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          draft_output="$(cargo run --quiet --locked --manifest-path tools/independent-soak-contract/Cargo.toml -- validate-contract tools/independent-soak-contract/contracts/draft-v1alpha1.json 2>&1)"
          echo "$draft_output"
          grep -Fqx 'NOT CERTIFICATION EVIDENCE' <<< "$draft_output"
          grep -Fq 'VALID_INELIGIBLE_DRAFT' <<< "$draft_output"

          fixture_output="$(cargo run --quiet --locked --manifest-path tools/independent-soak-contract/Cargo.toml -- verify-oracle-fixture tools/independent-soak-contract/fixtures/grouped-count-sum-alo-v2.json 2>&1)"
          echo "$fixture_output"
          grep -Fqx 'NOT CERTIFICATION EVIDENCE' <<< "$fixture_output"
          grep -Fq 'ORACLE_FIXTURE_OK' <<< "$fixture_output"

  # ============================================
  # CI Success Gate
  # ============================================
  ci-success:
    name: CI Success
    needs: [fmt, clippy, build-and-test, postgres-cdc-integration, features, dependency-generations, msrv, docs, soak-contract-scaffold]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-test.result }}" != "success" ]] || \
             [[ "${{ needs.postgres-cdc-integration.result }}" != "success" ]] || \
             [[ "${{ needs.features.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-generations.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.soak-contract-scaffold.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # ============================================
  # Note: Branch Protection Configuration
  # ============================================
  # The following branch protection rules must be configured in
  # GitHub repo Settings > Branches > main:
  #
  # Required status checks:
  #   - CI Success (this workflow)
  #   - Human Review Attestation (pr-review-gate.yml)
  #
  # Required reviews:
  #   - Require at least 1 approving review
  #   - Require review from CODEOWNERS
  #   - Dismiss stale reviews on new pushes
  #
  # Other:
  #   - Require branches to be up to date before merging
  #   - Do not allow bypassing the above settings
