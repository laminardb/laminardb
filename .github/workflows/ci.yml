name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

# Cancel redundant runs: when pushing multiple commits quickly or when
# both push and PR events fire for the same commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce debug info to speed up builds and linking
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Disable incremental compilation in CI to reduce disk usage
  CARGO_INCREMENTAL: 0
  # Limit parallel compiler jobs to avoid OOM on GitHub Actions runners (7 GB RAM)
  CARGO_BUILD_JOBS: 2

jobs:
  # ============================================
  # Formatting Check (fast, no deps)
  # ============================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check
      - name: Readability review baseline
        run: cargo +nightly run --quiet --manifest-path tools/readability-check/Cargo.toml -- .

  # ============================================
  # Clippy Lints
  # ============================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      - name: Clippy (no default features)
        run: cargo clippy --workspace --no-default-features -- -D warnings
      - name: Clippy (readability check)
        run: cargo clippy --manifest-path tools/readability-check/Cargo.toml --all-targets -- -D warnings

  # ============================================
  # Build & Test (Multi-Platform)
  # ============================================
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@nextest

      - uses: actions/setup-python@v7
        if: runner.os == 'Linux'
        with:
          python-version: '3.13'

      - name: Install Python process worker
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r python/laminardb_process/requirements.lock
          python -m pip install --no-deps ./python/laminardb_process

      - name: Python process worker tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s python/laminardb_process/tests -p 'test_*.py'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Tests include compilation - no separate build step needed
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --all-features
        env:
          # Debug-build recovery scenarios exceed libtest's 2 MiB worker stack. Keep the
          # larger bounded stack scoped to test processes on resource-constrained runners.
          RUST_MIN_STACK: 4194304
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          LAMINAR_PROCESS_PYTHON: python3

      # Windows: explicit features (default set, with vendored OpenSSL)
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        # Windows hosted runners have less scheduling and linking headroom. Two
        # concurrent test processes keep async runtime workers responsive.
        run: cargo nextest run --workspace --test-threads=2 --features "kafka,postgres-cdc,postgres-sink,mongodb-cdc,delta-lake,delta,files,parquet-lookup"
        env:
          RUST_MIN_STACK: 4194304

      # Doc tests only on Linux (redundant across platforms)
      - name: Run doc tests
        if: runner.os == 'Linux'
        run: cargo test --doc --workspace

  # ============================================
  # PostgreSQL CDC Compatibility
  # ============================================
  postgres-cdc-integration:
    name: PostgreSQL CDC (PostgreSQL ${{ matrix.postgres.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - { version: "17", port: "15532" }
          - { version: "18", port: "15533" }
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      LAMINAR_TEST_POSTGRES_PORT: ${{ matrix.postgres.port }}
      LAMINAR_REQUIRE_POSTGRES_CDC: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-cdc-${{ matrix.postgres.version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Start PostgreSQL ${{ matrix.postgres.version }}
        run: docker compose -f tests/docker/postgres-cdc-compose.yml up -d --wait postgres-${{ matrix.postgres.version }}
      - name: Connector replication, snapshot, and admission tests
        run: cargo test -p laminar-connectors --no-default-features --features postgres-cdc --test postgres_cdc_integration --test cdc_admission -- --test-threads=1
      - name: Snapshot visibility races under synchronous replication
        if: matrix.postgres.version == '17'
        run: |
          docker compose -f tests/docker/postgres-cdc-syncrep-compose.yml up -d --wait
          cargo test -p laminar-connectors --no-default-features --features postgres-cdc --test postgres_cdc_integration -- --ignored --test-threads=1 sync_rep
        env:
          LAMINAR_TEST_POSTGRES_SYNCREP_PORT: "15534"
      - name: PostgreSQL schema contracts
        run: cargo test -p laminar-connectors --no-default-features --features postgres-cdc,postgres-sink --test schema_postgres_integration -- --ignored --test-threads=1
        env:
          LAMINAR_SCHEMA_TEST_PG: host=127.0.0.1 port=${{ matrix.postgres.port }} user=laminar password=laminar-test-secret dbname=cdc
      - name: Direct PostgreSQL pipeline end-to-end tests
        run: cargo test -p laminar-db --no-default-features --features postgres-cdc,postgres-sink --test postgres_cdc_e2e -- --test-threads=1
      - name: Fixture logs
        if: failure()
        run: |
          docker compose -f tests/docker/postgres-cdc-compose.yml logs --tail=200
          docker compose -f tests/docker/postgres-cdc-syncrep-compose.yml logs --tail=200 || true

  # ============================================
  # MongoDB CDC direct pipelines
  # ============================================
  mongodb-cdc-integration:
    name: MongoDB CDC (direct pipelines)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mongodb-cdc
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Start MongoDB, PostgreSQL, and Iceberg fixtures
        run: |
          docker compose -f tests/docker/mongodb-cdc-compose.yml up -d --wait
          docker compose -f tests/docker/iceberg-compose.yml up -d --wait
      - name: Connector change-stream, replay, and admission tests
        run: cargo test -p laminar-connectors --no-default-features --features mongodb-cdc --test mongodb_integration --test cdc_admission -- --test-threads=2
      - name: MongoDB schema contracts
        run: cargo test -p laminar-connectors --no-default-features --features mongodb-cdc --test schema_mongodb_integration -- --ignored --test-threads=1
        env:
          LAMINAR_SCHEMA_TEST_MONGO: mongodb://127.0.0.1:27117/?directConnection=true&tls=false
      - name: Direct MongoDB pipeline end-to-end tests
        run: cargo test -p laminar-db --no-default-features --features mongodb-cdc,postgres-sink,delta-lake,files,iceberg --test mongodb_cdc_e2e -- --test-threads=1
        env:
          LAMINAR_REQUIRE_MONGODB_CDC: "1"
      - name: Fixture logs
        if: failure()
        run: |
          docker compose -f tests/docker/mongodb-cdc-compose.yml logs --tail=200
          docker compose -f tests/docker/iceberg-compose.yml logs --tail=200

  # ============================================
  # RabbitMQ source and sink (live broker)
  # ============================================
  # IBM MQ's live suites stay a manual lane: the queue manager image is amd64-only and licensed
  # for developer use (IBM MQ Advanced for Developers), so CI only compiles the `ibmmq` feature.
  rabbitmq-integration:
    name: RabbitMQ (live broker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rabbitmq
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config mold protobuf-compiler
      - name: Default builds exclude the AMQP client
        run: |
          if cargo tree -p laminar-server -e normal | grep -q '^.* lapin v'; then
            echo "the default laminar-server graph includes lapin" >&2
            exit 1
          fi
      - name: Start RabbitMQ
        run: docker compose -f tests/docker/compose.yml up -d --wait rabbitmq
      - name: Connector tests against the broker
        run: cargo test -p laminar-connectors --no-default-features --features "rabbitmq fpml" --test rabbitmq_integration -- --test-threads=2
        env:
          LAMINAR_REQUIRE_RABBITMQ: "1"
          LAMINAR_TEST_RABBITMQ_CONTAINER: laminardb-rabbitmq
          LAMINAR_TEST_RABBITMQ_TLS: "1"
      - name: SQL end-to-end tests
        run: cargo test -p laminar-db --no-default-features --features "rabbitmq fpml" --test rabbitmq_e2e -- --test-threads=1
        env:
          LAMINAR_REQUIRE_RABBITMQ: "1"
      - name: Standalone-server hard kills and broker restarts
        run: cargo test --release -p laminar-server --no-default-features --features rabbitmq --test rabbitmq_kill -- --ignored --test-threads=1 rabbitmq_at_least_once
        env:
          LAMINAR_RABBITMQ_KILL_SECONDS: "45"
      - name: Broker logs
        if: failure()
        run: docker compose -f tests/docker/compose.yml logs --tail=200 rabbitmq

  # ============================================
  # FIX source (QuickFIX C++ engine, local acceptor)
  # ============================================
  fix-source:
    name: FIX source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fix-source
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config mold protobuf-compiler
      - name: Default builds exclude the native engine
        run: |
          if cargo tree -p laminar-server -e normal | grep -q laminardb-quickfix-ffi; then
            echo "the default laminar-server graph links the QuickFIX engine" >&2
            exit 1
          fi
      - name: Clippy
        run: cargo clippy -p laminar-connectors --no-default-features --features "fix testing" --all-targets -- -D warnings
      - name: Engine qualification, journal, projection, and session scenarios
        run: cargo test -p laminar-connectors --no-default-features --features fix --lib -- 'fix::'
      - name: SQL end-to-end and process-kill recovery
        run: cargo test -p laminar-db --no-default-features --features "fix files" --test fix_source_e2e --test fix_source_crash
      - name: Exactly-once into Delta Lake across process kills
        run: cargo test -p laminar-db --no-default-features --features "fix delta-lake" --test fix_source_exactly_once
      - name: Server build and example profile
        run: cargo test -p laminar-server --no-default-features --features fix --bin laminardb shipped_server_configs_deserialize

  # ============================================
  # FpML source (vendored libxml2, pinned FpML 5.13 closure)
  # ============================================
  fpml-source:
    name: FpML source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fpml-source
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev mold protobuf-compiler
      - name: Default builds exclude the native validator
        run: |
          if cargo tree -p laminar-server -e normal | grep -q laminardb-libxml2-ffi; then
            echo "the default laminar-server graph links libxml2" >&2
            exit 1
          fi
      - name: Clippy
        run: cargo clippy -p laminar-connectors --no-default-features --features "fpml files kafka" --all-targets -- -D warnings
      - name: Clippy with the queue and FIX sources
        run: cargo clippy -p laminar-connectors --no-default-features --features "fpml fix rabbitmq ibmmq testing" --all-targets -- -D warnings
      - name: Validator security, schema closure, coverage manifest, goldens, and files source
        run: cargo test -p laminar-connectors --no-default-features --features "fpml files" --lib -- fpml
      - name: Independent oracle over every golden
        run: python3 tools/fpml_oracle.py
      - name: Kafka FpML messages (in-process mock cluster)
        run: cargo test -p laminar-connectors --no-default-features --features "kafka fpml" --lib -- kafka::source::tests::fpml
      - name: SQL end-to-end across restart
        run: cargo test -p laminar-db --no-default-features --features "fpml kafka" --test fpml_source_e2e
      - name: RabbitMQ and IBM MQ FpML options
        run: cargo test -p laminar-connectors --no-default-features --features "rabbitmq ibmmq fpml" --lib -- config::tests::fpml
      - name: FpML in FIX SecurityXML (local acceptor)
        run: |
          cargo test -p laminar-connectors --no-default-features --features "fix fpml" --lib -- fix::tests::fpml
          cargo test -p laminar-db --no-default-features --features "fix fpml" --test fix_source_e2e fpml_in_security_xml

  # ============================================
  # Release Build (main/develop only)
  # ============================================
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    # Only run on main/develop to save CI time on PRs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Build release
        run: cargo build --workspace --release --all-features
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # ============================================
  # Feature Combinations
  # ============================================
  features:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler

      - name: Check no default features
        run: cargo check --workspace --no-default-features

      - name: Check all features
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Check individual features
        run: |
          # Core features
          cargo check -p laminar-core --no-default-features
          cargo check -p laminar-core --no-default-features --features cluster
          cargo check -p laminar-core --no-default-features --features aws
          cargo check -p laminar-core --no-default-features --features azure
          cargo check -p laminar-core --no-default-features --features gcs

          # DB features
          cargo check -p laminar-db --no-default-features --features cluster
          cargo check -p laminar-db --no-default-features --features checkpoint-aws
          cargo check -p laminar-db --no-default-features --features checkpoint-azure
          cargo check -p laminar-db --no-default-features --features checkpoint-gcs
          cargo check -p laminar-db --no-default-features --features delta-lake-s3
          cargo check -p laminar-db --no-default-features --features delta-lake-azure
          cargo check -p laminar-db --no-default-features --features delta-lake-gcs
          cargo check -p laminar-db --no-default-features --features iceberg
          cargo check -p laminar-db --no-default-features --features iceberg-azure
          cargo check -p laminar-db --no-default-features --features iceberg-gcs

          # Server provider pass-through features
          cargo check -p laminar-server --no-default-features --features checkpoint-aws
          cargo check -p laminar-server --no-default-features --features checkpoint-azure
          cargo check -p laminar-server --no-default-features --features checkpoint-gcs
          cargo check -p laminar-server --no-default-features --features delta-lake-s3
          cargo check -p laminar-server --no-default-features --features delta-lake-azure
          cargo check -p laminar-server --no-default-features --features delta-lake-gcs
          cargo check -p laminar-server --no-default-features --features iceberg
          cargo check -p laminar-server --no-default-features --features iceberg-azure
          cargo check -p laminar-server --no-default-features --features iceberg-gcs

          # Connector features
          cargo check -p laminar-connectors --no-default-features
          cargo check -p laminar-connectors --no-default-features --features kafka
          cargo check -p laminar-connectors --no-default-features --features postgres-cdc
          cargo check -p laminar-connectors --no-default-features --features postgres-sink
          cargo check -p laminar-connectors --no-default-features --features mongodb-cdc
          cargo check -p laminar-connectors --no-default-features --features files
          cargo check -p laminar-connectors --no-default-features --features delta-lake-s3
          cargo check -p laminar-connectors --no-default-features --features delta-lake-azure
          cargo check -p laminar-connectors --no-default-features --features delta-lake-gcs
          cargo check -p laminar-connectors --no-default-features --features parquet-lookup
          cargo check -p laminar-connectors --all-targets --no-default-features --features rabbitmq
          # IBM MQ loads IBM's client library at run time; building needs no IBM software.
          cargo check -p laminar-connectors --all-targets --no-default-features --features ibmmq
          cargo check -p laminar-server --no-default-features --features rabbitmq,ibmmq

          # Iceberg catalog and storage isolation
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-core
          cargo clippy -p laminar-connectors --all-targets --no-default-features --features iceberg-core -- -D warnings
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-catalog-rest
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-catalog-glue
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-catalog-hms
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-catalog-s3tables
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-catalog-sql
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-storage-s3
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-storage-gcs
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-storage-azure
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-storage-fs
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-gcs
          cargo check -p laminar-connectors --all-targets --no-default-features --features iceberg-azure
          cargo check -p laminar-connectors --all-targets --no-default-features --features "iceberg-catalog-rest,iceberg-storage-gcs"
          cargo check -p laminar-connectors --all-targets --no-default-features --features "iceberg-catalog-rest,iceberg-storage-azure"
          cargo check -p laminar-connectors --all-targets --no-default-features --features "iceberg-catalog-rest,iceberg-catalog-glue,iceberg-catalog-hms,iceberg-catalog-s3tables,iceberg-catalog-sql,iceberg-storage-s3,iceberg-storage-gcs,iceberg-storage-azure,iceberg-storage-fs"

  iceberg-integration:
    name: Iceberg REST, S3, and cluster recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: iceberg-integration
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Start Iceberg REST, MinIO, and Redpanda
        run: |
          docker compose -p laminardb-iceberg-ci -f tests/docker/iceberg-compose.yml up -d --wait
          docker compose -p laminardb-kafka-ci -f tests/docker/compose.yml up -d --wait redpanda
      - name: Run Iceberg append integration tests
        run: cargo test --profile soak -p laminar-connectors --no-default-features --features iceberg --test iceberg_append -- --ignored --test-threads=1 --nocapture
      - name: Run Iceberg cluster recovery test
        run: cargo test --profile soak -p laminar-server --no-default-features --features "cluster,aws,kafka,iceberg" --test iceberg_cluster_soak -- --ignored --exact --test-threads=1 --nocapture
      - name: Capture service logs after failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose -p laminardb-iceberg-ci -f tests/docker/iceberg-compose.yml logs --no-color
          docker compose -p laminardb-kafka-ci -f tests/docker/compose.yml logs --no-color redpanda
      - name: Stop Iceberg REST, MinIO, and Redpanda
        if: always()
        run: |
          docker compose -p laminardb-kafka-ci -f tests/docker/compose.yml down -v
          docker compose -p laminardb-iceberg-ci -f tests/docker/iceberg-compose.yml down -v

  dependency-generations:
    name: Analytical Dependency Generations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reject divergent analytical dependency generations
        run: python3 tools/check_analytical_dependencies.py
      - name: Verify maintained fork packages can be assembled
        run: |
          cargo package --manifest-path vendor/pgwire/Cargo.toml --no-verify
          cargo package --manifest-path vendor/pgwire-replication/Cargo.toml --no-verify
          cargo package --manifest-path vendor/quickfix-ffi/Cargo.toml --no-verify
          cargo package --manifest-path vendor/libxml2-ffi/Cargo.toml --no-verify
      - name: Verify workspace packages can be assembled
        run: |
          # The release publishes the maintained forks before the Laminar crates.
          cargo package --workspace --locked --no-verify \
            --config 'patch.crates-io.laminardb-pgwire.path="vendor/pgwire"' \
            --config 'patch.crates-io.laminardb-pgwire-replication.path="vendor/pgwire-replication"' \
            --config 'patch.crates-io.laminardb-quickfix-ffi.path="vendor/quickfix-ffi"' \
            --config 'patch.crates-io.laminardb-libxml2-ffi.path="vendor/libxml2-ffi"'

  # ============================================
  # MSRV Check
  # ============================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract MSRV
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | cut -d'"' -f2 || echo "1.95")
          if [[ -z "$MSRV" ]]; then
            MSRV="1.95"
          fi
          echo "MSRV: $MSRV"
          echo "version=$MSRV" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev protobuf-compiler
      - run: cargo check --workspace

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      # Match the toolchain used by the Pages documentation build.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev libcurl4-openssl-dev cmake pkg-config libsasl2-dev libclang-dev libudev-dev mold protobuf-compiler
      - name: Build docs
        run: cargo +nightly doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # ============================================
  # Security Audit
  # ============================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify dependency exception policy and security backport
        run: |
          python3 tools/check_dependency_exceptions.py
          python3 -m unittest discover -s tools -p 'test_dependency_exceptions.py'
      - name: Test XML security backport
        run: cargo test --manifest-path vendor/quick-xml/Cargo.toml --all-features --lib --locked
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings

  # ============================================
  # Dependency Licenses
  # ============================================
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify dependency exception policy and security backport
        run: python3 tools/check_dependency_exceptions.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked --workspace

  # ============================================
  # Miri (Unsafe Code Verification)
  # ============================================
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Only run on main/develop to save CI time
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Setup Miri
        run: cargo +nightly miri setup
      - name: Run Miri on core
        run: |
          cargo +nightly miri test -p laminar-core --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        continue-on-error: true

  # ============================================
  # Independent Evidence Contract Scaffolds
  # ============================================
  soak-contract-scaffold:
    name: Ineligible contract/model scaffolds (NOT evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - name: Format standalone contract tool
        run: cargo fmt --manifest-path tools/independent-soak-contract/Cargo.toml -- --check
      - name: Lint standalone contract tool
        run: cargo clippy --locked --manifest-path tools/independent-soak-contract/Cargo.toml --all-targets -- -D warnings
      - name: Test standalone contract tool
        run: cargo test --locked --manifest-path tools/independent-soak-contract/Cargo.toml
      - name: Reject Laminar, path, and workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          manifest=tools/independent-soak-contract/Cargo.toml
          if grep -Eq '(path|workspace)[[:space:]]*=' "$manifest"; then
            echo "standalone soak contract unexpectedly uses a path or workspace dependency"
            exit 1
          fi
          dependency_tree="$(cargo tree --locked --manifest-path tools/independent-soak-contract/Cargo.toml --prefix none)"
          if grep -Eq '^laminar[-_]' <<< "$dependency_tree"; then
            echo "standalone soak contract unexpectedly depends on a Laminar package"
            exit 1
          fi
      - name: Validate ineligible draft and golden oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          draft_output="$(cargo run --quiet --locked --manifest-path tools/independent-soak-contract/Cargo.toml -- validate-contract tools/independent-soak-contract/contracts/draft-v1alpha1.json 2>&1)"
          echo "$draft_output"
          grep -Fqx 'NOT CERTIFICATION EVIDENCE' <<< "$draft_output"
          grep -Fq 'VALID_INELIGIBLE_DRAFT' <<< "$draft_output"

          fixture_output="$(cargo run --quiet --locked --manifest-path tools/independent-soak-contract/Cargo.toml -- verify-oracle-fixture tools/independent-soak-contract/fixtures/grouped-count-sum-alo-v2.json 2>&1)"
          echo "$fixture_output"
          grep -Fqx 'NOT CERTIFICATION EVIDENCE' <<< "$fixture_output"
          grep -Fq 'ORACLE_FIXTURE_OK' <<< "$fixture_output"

  # ============================================
  # CI Success Gate
  # ============================================
  ci-success:
    name: CI Success
    needs: [fmt, clippy, build-and-test, postgres-cdc-integration, mongodb-cdc-integration, rabbitmq-integration, features, iceberg-integration, dependency-generations, msrv, docs, audit, deny, soak-contract-scaffold]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-test.result }}" != "success" ]] || \
             [[ "${{ needs.postgres-cdc-integration.result }}" != "success" ]] || \
             [[ "${{ needs.mongodb-cdc-integration.result }}" != "success" ]] || \
             [[ "${{ needs.features.result }}" != "success" ]] || \
             [[ "${{ needs.iceberg-integration.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-generations.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]] || \
             [[ "${{ needs.deny.result }}" != "success" ]] || \
             [[ "${{ needs.soak-contract-scaffold.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # ============================================
  # Note: Branch Protection Configuration
  # ============================================
  # The following branch protection rules must be configured in
  # GitHub repo Settings > Branches > main:
  #
  # Required status checks:
  #   - CI Success (this workflow)
  #   - Human Review Attestation (pr-review-gate.yml)
  #
  # Required reviews:
  #   - Require at least 1 approving review
  #   - Require review from CODEOWNERS
  #   - Dismiss stale reviews on new pushes
  #
  # Other:
  #   - Require branches to be up to date before merging
  #   - Do not allow bypassing the above settings
