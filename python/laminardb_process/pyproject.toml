[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laminardb-process"
version = "0.1.0"
description = "Loopback Python worker for LaminarDB stateful process functions"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "pyarrow==20.0.0",
    "numpy==2.4.0",
    "typing-extensions==4.16.0",
]

[project.scripts]
laminardb-process-worker = "laminardb_process.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laminardb_process*"]
