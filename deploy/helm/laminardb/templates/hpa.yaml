{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "laminardb.fullname" . }}
  labels:
    {{- include "laminardb.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    {{- if include "laminardb.useStatefulSet" . }}
    kind: StatefulSet
    {{- else }}
    kind: Deployment
    {{- end }}
    name: {{ include "laminardb.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- $scaleDown := .Values.autoscaling.scaleDown | default dict }}
  {{- $scaleUp := .Values.autoscaling.scaleUp | default dict }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $scaleUp.stabilizationWindowSeconds | default 120 }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ $scaleDown.stabilizationWindowSeconds | default 600 }}
      {{- if and (eq .Values.laminardb.mode "cluster") (not $scaleDown.enabled) }}
      selectPolicy: Disabled
      {{- else }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
      {{- end }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
