# One row per FpML total return or dividend swap trade (returnSwap, equitySwapTransactionSupplement, dividendSwapTransactionSupplement, dividendSwapOptionTransactionSupplement) with the shared trade-level columns and the
# product's typed economics. Exactly one product struct is non-null per row; `product_type` names
# it. Trades of other asset classes are not rows of this profile; the
# fpml-5-13-confirmation-trade profile has every trade.
include = ["trade-columns.toml", "products/equity.toml"]

[profile]
name = "fpml-5-13-confirmation-equity-swaps"
version = 1
description = "FpML 5.13 confirmation view: one row per total return or dividend swap trade with typed economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader][{equity_swaps_product}]"

[sets]
equity_swaps_product = [
  "returnSwap",
  "equitySwapTransactionSupplement",
  "dividendSwapTransactionSupplement",
  "dividendSwapOptionTransactionSupplement",
]

[[columns]]
name = "return_swap"
type = "struct<return_swap>"
path = "returnSwap"

[[columns]]
name = "equity_swap_transaction_supplement"
type = "struct<equity_swap_transaction_supplement>"
path = "equitySwapTransactionSupplement"

[[columns]]
name = "dividend_swap_transaction_supplement"
type = "struct<dividend_swap_transaction_supplement>"
path = "dividendSwapTransactionSupplement"

[[columns]]
name = "dividend_swap_option_transaction_supplement"
type = "struct<dividend_swap_option_transaction_supplement>"
path = "dividendSwapOptionTransactionSupplement"
