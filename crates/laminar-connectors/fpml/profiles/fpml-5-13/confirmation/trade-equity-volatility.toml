# One row per FpML variance, volatility, or correlation swap trade (varianceSwap, varianceSwapTransactionSupplement, varianceOptionTransactionSupplement, volatilitySwap, volatilitySwapTransactionSupplement, correlationSwap) with the shared trade-level columns and the
# product's typed economics. Exactly one product struct is non-null per row; `product_type` names
# it. Trades of other asset classes are not rows of this profile; the
# fpml-5-13-confirmation-trade profile has every trade.
include = ["trade-columns.toml", "products/equity.toml"]

[profile]
name = "fpml-5-13-confirmation-equity-volatility"
version = 1
description = "FpML 5.13 confirmation view: one row per variance, volatility, or correlation swap trade with typed economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader][{equity_volatility_product}]"

[sets]
equity_volatility_product = [
  "varianceSwap",
  "varianceSwapTransactionSupplement",
  "varianceOptionTransactionSupplement",
  "volatilitySwap",
  "volatilitySwapTransactionSupplement",
  "correlationSwap",
]

[[columns]]
name = "variance_swap"
type = "struct<variance_swap>"
path = "varianceSwap"

[[columns]]
name = "variance_swap_transaction_supplement"
type = "struct<variance_swap_transaction_supplement>"
path = "varianceSwapTransactionSupplement"

[[columns]]
name = "variance_option_transaction_supplement"
type = "struct<variance_option_transaction_supplement>"
path = "varianceOptionTransactionSupplement"

[[columns]]
name = "volatility_swap"
type = "struct<volatility_swap>"
path = "volatilitySwap"

[[columns]]
name = "volatility_swap_transaction_supplement"
type = "struct<volatility_swap_transaction_supplement>"
path = "volatilitySwapTransactionSupplement"

[[columns]]
name = "correlation_swap"
type = "struct<correlation_swap>"
path = "correlationSwap"
