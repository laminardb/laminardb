# One row per FpML confirmation-view document of any kind: data documents, requests,
# responses, notifications, exceptions, and loan notifications and statements. Columns type the
# message envelope and each root-level element: identifiers, statuses, reasons, approvals,
# allocations, and summaries of the trades, post-trade events, and loan events the document
# carries (their `locator` joins the trade and loan profiles, which type them in full). Every
# document yields exactly one row, so this profile also fits one-message-per-record transports.
include = ["messages.toml"]

[profile]
name = "fpml-5-13-confirmation-document"
version = 1
description = "FpML 5.13 confirmation view: one row per document with its message envelope and root-level content"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "."

[[columns]]
name = "document_sha256"
type = "utf8"
meta = "document_sha256"
required = true

[[columns]]
name = "document_bytes"
type = "uint64"
meta = "document_bytes"
required = true

[[columns]]
name = "document_root"
type = "utf8"
meta = "root"
required = true

[[columns]]
name = "fpml_version"
type = "utf8"
meta = "fpml_version"
required = true

[[columns]]
name = "expected_build"
type = "int64"
path = "@expectedBuild"

[[columns]]
name = "actual_build"
type = "int64"
path = "@actualBuild"

[[columns]]
name = "header"
type = "struct<message_header>"
path = "header"

[[columns]]
name = "creation_time_utc"
type = "timestamp(ns, UTC)"
path = "header/creationTimestamp"
offset = "optional"
description = "Message creation instant; null when the sender wrote no UTC offset"

[[columns]]
name = "validations"
type = "list<utf8>"
path = "validation"

[[columns]]
name = "is_correction"
type = "bool"
path = "isCorrection"

[[columns]]
name = "correlation_id"
type = "utf8"
path = "correlationId"

[[columns]]
name = "correlation_id_scheme"
type = "utf8"
path = "correlationId/@correlationIdScheme"

[[columns]]
name = "parent_correlation_id"
type = "utf8"
path = "parentCorrelationId"

[[columns]]
name = "sequence_number"
type = "int64"
path = "sequenceNumber"

[[columns]]
name = "on_behalf_of"
type = "list<struct<on_behalf_of>>"
path = "onBehalfOf"

[[columns]]
name = "originating_event"
type = "utf8"
path = "originatingEvent"

[[columns]]
name = "terminating_event"
type = "utf8"
path = "terminatingEvent"

[[columns]]
name = "trades"
type = "list<struct<trade_reference>>"
path = "trade"

[[columns]]
name = "trade_package"
type = "struct<trade_package>"
path = "tradePackage"

[[columns]]
name = "events"
type = "list<struct<trading_event>>"
path = "{post_trade_event}"

[[columns]]
name = "quotes"
type = "list<struct<basic_quotation>>"
path = "quote"

[[columns]]
name = "trade_reference_information"
type = "struct<trade_reference_information>"
path = "tradeReferenceInformation"

[[columns]]
name = "trade_identifiers"
type = "list<struct<trade_identifier>>"
path = "tradeIdentifier | partyTradeIdentifier"

[[columns]]
name = "block_trade_identifier"
type = "struct<trade_identifier>"
path = "blockTradeIdentifier"

[[columns]]
name = "product_type"
type = "utf8"
path = "productType"

[[columns]]
name = "portfolio_name"
type = "utf8"
path = "portfolioReference/portfolioName"

[[columns]]
name = "portfolio_sequence_number"
type = "int64"
path = "portfolioReference/sequenceNumber"

[[columns]]
name = "portfolio_submissions_complete"
type = "bool"
path = "portfolioReference/submissionsComplete"

[[columns]]
name = "portfolio_ids"
type = "list<utf8>"
path = "portfolio/@id"

[[columns]]
name = "report_id"
type = "utf8"
path = "reportIdentification/reportId"

[[columns]]
name = "report_section_number"
type = "int64"
path = "reportIdentification/sectionNumber"

[[columns]]
name = "compression_type"
type = "utf8"
path = "compressionActivity/compressionType"

[[columns]]
name = "credit_limit_models"
