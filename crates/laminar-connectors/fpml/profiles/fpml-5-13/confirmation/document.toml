path = "reason"

[[columns]]
name = "additional_data_mime_type"
type = "utf8"
path = "additionalData/mimeType"

[[columns]]
name = "additional_data_text"
type = "utf8"
path = "additionalData/string"

[[columns]]
name = "original_message_root"
type = "utf8"
path = "originalMessage/*/#name"
description = "Root name of an echoed original message; its content is kept as unvalidated data"

[[columns]]
