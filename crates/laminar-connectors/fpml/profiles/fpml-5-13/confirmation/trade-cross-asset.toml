# One row per FpML generic, standardized, or strategy trade (genericProduct, standardProduct, strategy) with the shared trade-level columns and the
# product's typed economics. Exactly one product struct is non-null per row; `product_type` names
# it. Trades of other asset classes are not rows of this profile; the
# fpml-5-13-confirmation-trade profile has every trade.
include = ["trade-columns.toml", "products/cross-asset.toml"]

[profile]
name = "fpml-5-13-confirmation-cross-asset"
version = 1
description = "FpML 5.13 confirmation view: one row per generic, standardized, or strategy trade with typed economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader][{cross_asset_product}]"

[sets]
cross_asset_product = [
  "genericProduct",
  "standardProduct",
  "strategy",
]

[[columns]]
name = "generic_product"
type = "struct<generic_product>"
path = "genericProduct"

[[columns]]
name = "standard_product"
type = "struct<standard_product>"
path = "standardProduct"

[[columns]]
name = "strategy"
type = "struct<strategy>"
path = "strategy"
