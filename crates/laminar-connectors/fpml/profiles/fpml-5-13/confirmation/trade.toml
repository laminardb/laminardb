# One row per FpML trade, with its document context and the economics of its product.
#
# Rows are every `trade` element that has a `tradeHeader` (confirmation-view Trade), wherever it
# appears: directly under a data document or message, inside a trade package, or inside a
# business event such as an amendment or clearing result. `row_locator` and `trade_context` say
# where. A document without such trades (for example a loan notice or a status message)
# produces no rows from this profile.
#
# Exactly one product struct is non-null per row; `product_type` names it.
include = ["common.toml", "products/rates.toml"]

[profile]
name = "fpml-5-13-confirmation-trade"
version = 1
description = "FpML 5.13 confirmation view: one row per trade with typed product economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader]"

[[columns]]
name = "document_sha256"
type = "utf8"
meta = "document_sha256"
required = true

[[columns]]
name = "document_root"
type = "utf8"
meta = "root"
required = true

[[columns]]
name = "fpml_version"
type = "utf8"
meta = "fpml_version"
required = true

[[columns]]
name = "trade_ordinal"
type = "uint32"
meta = "row"
required = true

[[columns]]
name = "trade_count"
type = "uint32"
meta = "row_count"
required = true

[[columns]]
name = "row_locator"
type = "utf8"
meta = "row_locator"
required = true

[[columns]]
name = "trade_context"
type = "utf8"
path = "../#name"
description = "Local name of the trade's parent element (the document root or a business event)"

[[columns]]
name = "message_id"
type = "utf8"
path = "/header/messageId"

[[columns]]
name = "message_id_scheme"
type = "utf8"
path = "/header/messageId/@messageIdScheme"

[[columns]]
name = "in_reply_to"
type = "utf8"
path = "/header/inReplyTo"

[[columns]]
name = "sent_by"
type = "utf8"
path = "/header/sentBy"

[[columns]]
name = "creation_timestamp"
type = "datetime"
path = "/header/creationTimestamp"

[[columns]]
name = "is_correction"
type = "bool"
path = "/isCorrection"

[[columns]]
name = "correlation_id"
type = "utf8"
path = "/correlationId"

[[columns]]
name = "sequence_number"
type = "int64"
path = "/sequenceNumber"

[[columns]]
name = "trade_id"
type = "utf8"
path = "@id"
description = "Document-local id of the trade element, when present"

[[columns]]
name = "trade_header"
type = "struct<trade_header>"
path = "tradeHeader"
required = true

[[columns]]
name = "product_type"
type = "utf8"
path = "{product}/#name"
required = true
description = "Local name of the product element (for example swap, fxOption, creditDefaultSwap)"

[[columns]]
name = "swap"
type = "struct<swap>"
path = "swap"

[[columns]]
name = "fra"
type = "struct<fra>"
path = "fra"

[[columns]]
name = "cap_floor"
type = "struct<cap_floor>"
path = "capFloor"

[[columns]]
name = "swaption"
type = "struct<swaption>"
path = "swaption"

[[columns]]
name = "bullet_payment"
type = "struct<bullet_payment>"
path = "bulletPayment"

[[columns]]
name = "bond_option"
type = "struct<bond_option>"
path = "bondOption"

[[columns]]
name = "other_party_payments"
type = "list<struct<payment>>"
path = "otherPartyPayment"

[[columns]]
name = "broker_party_hrefs"
type = "list<utf8>"
path = "brokerPartyReference/@href"

[[columns]]
name = "calculation_agent"
type = "struct<calculation_agent>"
path = "calculationAgent"

[[columns]]
name = "calculation_agent_business_center"
type = "utf8"
path = "calculationAgentBusinessCenter"

[[columns]]
name = "documentation"
type = "struct<documentation>"
path = "documentation"

[[columns]]
name = "governing_law"
type = "utf8"
path = "governingLaw"

[[columns]]
name = "parties"
type = "list<struct<party>>"
path = "/party"
description = "Every party declared in the document"

[[columns]]
name = "accounts"
type = "list<struct<account>>"
path = "/account"
