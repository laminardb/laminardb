# One row per FpML credit derivative trade (creditDefaultSwap, creditDefaultSwapOption) with the shared trade-level columns and the
# product's typed economics. Exactly one product struct is non-null per row; `product_type` names
# it. Trades of other asset classes are not rows of this profile; the
# fpml-5-13-confirmation-trade profile has every trade.
include = ["trade-columns.toml", "products/credit.toml"]

[profile]
name = "fpml-5-13-confirmation-credit"
version = 1
description = "FpML 5.13 confirmation view: one row per credit derivative trade with typed economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader][{credit_product}]"

[sets]
credit_product = [
  "creditDefaultSwap",
  "creditDefaultSwapOption",
]

[[columns]]
name = "credit_default_swap"
type = "struct<credit_default_swap>"
path = "creditDefaultSwap"

[[columns]]
name = "credit_default_swap_option"
type = "struct<credit_default_swap_option>"
path = "creditDefaultSwapOption"
