# One row per FpML equity option, forward, or accumulator trade (equityOption, equityForward, brokerEquityOption, equityOptionTransactionSupplement, equityAccumulator) with the shared trade-level columns and the
# product's typed economics. Exactly one product struct is non-null per row; `product_type` names
# it. Trades of other asset classes are not rows of this profile; the
# fpml-5-13-confirmation-trade profile has every trade.
include = ["trade-columns.toml", "products/equity.toml"]

[profile]
name = "fpml-5-13-confirmation-equity-options"
version = 1
description = "FpML 5.13 confirmation view: one row per equity option, forward, or accumulator trade with typed economics"
artifact = "fpml-5-13-8-rec-2/confirmation"
roots = "documents"
rows = "**/trade[tradeHeader][{equity_options_product}]"

[sets]
equity_options_product = [
  "equityOption",
  "equityForward",
  "brokerEquityOption",
  "equityOptionTransactionSupplement",
  "equityAccumulator",
]

[[columns]]
name = "equity_option"
type = "struct<equity_option>"
path = "equityOption"

[[columns]]
name = "equity_forward"
type = "struct<equity_forward>"
path = "equityForward"

[[columns]]
name = "broker_equity_option"
type = "struct<broker_equity_option>"
path = "brokerEquityOption"

[[columns]]
name = "equity_option_transaction_supplement"
type = "struct<equity_option_transaction_supplement>"
path = "equityOptionTransactionSupplement"

[[columns]]
name = "equity_accumulator"
type = "struct<equity_accumulator>"
path = "equityAccumulator"
