  { name = "return_pricing_dates", type = "struct<pricing_dates>", path = "commodityReturnCalculation/pricingDates" },
  { name = "variance_strike_price", type = "decimal", path = "varianceStrikePrice" },
  { name = "volatility_strike_price", type = "decimal", path = "volatilityStrikePrice" },
  { name = "annualization_factor", type = "decimal", path = "varianceCalculation/annualizationFactor" },
  { name = "n_adjustment", type = "bool", path = "varianceCalculation/nAdjustment" },
  { name = "fixed_rate", type = "decimal", path = "commodityFixedInterestCalculation/fixedRate" },
  { name = "day_count_fraction", type = "utf8", path = "commodityFixedInterestCalculation/dayCountFraction" },
]

# ── Products ─────────────────────────────────────────────────────────────────

