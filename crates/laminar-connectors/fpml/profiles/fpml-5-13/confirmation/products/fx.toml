# Foreign exchange products: spot/forward (fxSingleLeg), fxSwap, fxOption, fxDigitalOption,
# fxFlexibleForward, fxForwardVolatilityAgreement, FX variance and volatility swaps, accruals
# (fxAccrualForward, fxAccrualOption, fxAccrualDigitalOption, fxRangeAccrual), target
# redemption forwards (fxTargetKnockoutForward), and termDeposit. Fixing schedules, payoff
# regions, and barriers are kept as supplied; settlement amounts are not computed.
include = ["../common.toml", "../options.toml"]

[sets]
fx_disruption_event = { substitution = "fxDisruptionEvent" }
fx_disruption_fallback = { substitution = "fxDisruptionFallback" }

# ── Shared FX structures ─────────────────────────────────────────────────────

[structs.quoted_currency_pair]
fields = [
  { name = "currency1", type = "utf8", path = "currency1" },
  { name = "currency2", type = "utf8", path = "currency2" },
  { name = "quote_basis", type = "utf8", path = "quoteBasis" },
]

[structs.cross_rate]
fields = [
  { name = "currency1", type = "utf8", path = "currency1" },
  { name = "currency2", type = "utf8", path = "currency2" },
  { name = "quote_basis", type = "utf8", path = "quoteBasis" },
  { name = "rate", type = "decimal", path = "rate" },
  { name = "spot_rate", type = "decimal", path = "spotRate" },
  { name = "forward_points", type = "decimal", path = "forwardPoints" },
]

[structs.exchange_rate]
fields = [
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
  { name = "rate", type = "decimal", path = "rate" },
  { name = "spot_rate", type = "decimal", path = "spotRate" },
  { name = "forward_points", type = "decimal", path = "forwardPoints" },
  { name = "point_value", type = "decimal", path = "pointValue" },
  { name = "cross_rates", type = "list<struct<cross_rate>>", path = "crossRate" },
]

[structs.information_source]
fields = [
  { name = "rate_source", type = "utf8", path = "rateSource" },
  { name = "rate_source_page", type = "utf8", path = "rateSourcePage" },
  { name = "rate_source_page_heading", type = "utf8", path = "rateSourcePageHeading" },
  { name = "fixing_time", type = "struct<business_center_time>", path = "fixingTime" },
]

[structs.fx_fixing]
fields = [
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
  { name = "fixing_date", type = "date32", path = "fixingDate" },
  { name = "fx_spot_rate_source", type = "struct<fx_spot_rate_source>", path = "fxSpotRateSource" },
]

[structs.fx_rate_source_fixing]
fields = [
  { name = "settlement_rate_option", type = "utf8", path = "settlementRateSource/settlementRateOption" },
  { name = "fixing_date", type = "struct<adjustable_date>", path = "fixingDate" },
]

[structs.fx_cash_settlement]
description = "Non-deliverable or cash settlement terms (FxCashSettlement / FxCashSettlementSimple)"
fields = [
  { name = "settlement_currency", type = "utf8", path = "settlementCurrency" },
  { name = "reference_currency", type = "utf8", path = "referenceCurrency" },
  { name = "notional_amount", type = "struct<money>", path = "notionalAmount" },
  { name = "fixings", type = "list<struct<fx_fixing>>", path = "fixing" },
  { name = "rate_source_fixings", type = "list<struct<fx_rate_source_fixing>>", path = "rateSourceFixing" },
  { name = "settlement_date", type = "struct<adjustable_date>", path = "settlementDate" },
]

[structs.fx_disruption]
fields = [
  { name = "base_currency", type = "utf8", path = "baseCurrency" },
  { name = "reference_currency", type = "utf8", path = "referenceCurrency" },
  { name = "applicable_terms", type = "list<utf8>", path = "provisions/applicableTerms" },
  { name = "events", type = "list<utf8>", path = "provisions/events/{fx_disruption_event}/#name" },
  { name = "fallbacks", type = "list<utf8>", path = "provisions/fallbacks/{fx_disruption_fallback}/#name" },
]

[structs.fx_core_details]
description = "FxCoreDetails.model: the exchanged currencies, value date, and rate"
fields = [
  { name = "exchanged_currency1", type = "struct<payment>", path = "exchangedCurrency1" },
  { name = "exchanged_currency2", type = "struct<payment>", path = "exchangedCurrency2" },
  { name = "dealt_currency", type = "utf8", path = "dealtCurrency" },
  { name = "tenor_name", type = "utf8", path = "tenorName" },
  { name = "tenor_period", type = "struct<period>", path = "tenorPeriod" },
  { name = "value_date", type = "date32", path = "valueDate" },
  { name = "currency1_value_date", type = "date32", path = "currency1ValueDate" },
  { name = "currency2_value_date", type = "date32", path = "currency2ValueDate" },
  { name = "exchange_rate", type = "struct<exchange_rate>", path = "exchangeRate" },
  { name = "non_deliverable_settlement", type = "struct<fx_cash_settlement>", path = "nonDeliverableSettlement" },
  { name = "disruptions", type = "list<struct<fx_disruption>>", path = "disruption" },
]

[structs.fx_option_premium]
fields = [
  { name = "payer_party_href", type = "utf8", path = "payerPartyReference/@href" },
  { name = "receiver_party_href", type = "utf8", path = "receiverPartyReference/@href" },
  { name = "payment_date", type = "struct<adjustable_or_relative_date>", path = "paymentDate" },
  { name = "payment_amount", type = "struct<money>", path = "paymentAmount" },
  { name = "settlement_style", type = "utf8", path = "settlementInformation/standardSettlementStyle" },
  { name = "quote_value", type = "decimal", path = "quote/value" },
  { name = "quote_basis", type = "utf8", path = "quote/quoteBasis" },
]

[structs.fx_exercise]
description = "FX American or European exercise (FxAmericanExercise, FxEuropeanExercise, FxDigitalAmericanExercise)"
fields = [
  { name = "style", type = "utf8", path = "#name" },
  { name = "commencement_date", type = "struct<adjustable_or_relative_date>", path = "commencementDate" },
  { name = "expiry_date", type = "date32", path = "expiryDate" },
  { name = "expiry_time", type = "struct<business_center_time>", path = "expiryTime" },
  { name = "cut_name", type = "utf8", path = "cutName" },
  { name = "value_date", type = "date32", path = "valueDate" },
  { name = "latest_value_date", type = "date32", path = "latestValueDate" },
  { name = "multiple_exercise_minimum", type = "struct<money>", path = "multipleExercise/minimumNotionalAmount" },
  { name = "multiple_exercise_maximum", type = "struct<money>", path = "multipleExercise/maximumNotionalAmount" },
]

[structs.fx_strike]
fields = [
  { name = "rate", type = "decimal", path = "rate" },
  { name = "strike_quote_basis", type = "utf8", path = "strikeQuoteBasis" },
]

[structs.fx_option_barrier]
description = "Barrier feature of an FX option (FxBarrierFeature)"
fields = [
  { name = "barrier_type", type = "utf8", path = "barrierType" },
  { name = "direction", type = "utf8", path = "direction" },
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
  { name = "trigger_rate", type = "decimal", path = "triggerRate" },
  { name = "information_sources", type = "list<struct<information_source>>", path = "informationSource" },
  { name = "observation_start_date", type = "date32", path = "observationStartDate" },
  { name = "observation_end_date", type = "date32", path = "observationEndDate" },
]

[structs.fx_barrier]
description = "Barrier of an accrual or target product (FxComplexBarrierBase types)"
fields = [
  { name = "barrier_type", type = "utf8", path = "barrierType" },
  { name = "style", type = "utf8", path = "style" },
  { name = "scope", type = "utf8", path = "scope" },
  { name = "condition", type = "utf8", path = "condition" },
  { name = "trigger_rate", type = "struct<schedule>", path = "triggerRate" },
  { name = "observation_start_date", type = "date32", path = "observationStartDate" },
  { name = "observation_end_date", type = "date32", path = "observationEndDate" },
  { name = "accrual_retention", type = "utf8", path = "accrualRetention" },
  { name = "observable_href", type = "utf8", path = "observableReference/@href" },
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
]

[structs.fx_trigger]
description = "Digital touch or trigger condition (FxTouch, FxTrigger, FxAccrualTrigger)"
fields = [
  { name = "touch_condition", type = "utf8", path = "touchCondition" },
  { name = "trigger_condition", type = "utf8", path = "triggerCondition" },
  { name = "direction", type = "utf8", path = "direction" },
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
  { name = "trigger_rate", type = "decimal", path = "triggerRate" },
  { name = "spot_rate", type = "decimal", path = "spotRate" },
  { name = "information_sources", type = "list<struct<information_source>>", path = "informationSource" },
  { name = "observation_start_date", type = "date32", path = "observationStartDate" },
  { name = "observation_end_date", type = "date32", path = "observationEndDate" },
]

[structs.fx_option_payout]
fields = [
  { name = "currency", type = "utf8", path = "currency" },
  { name = "amount", type = "decimal", path = "amount" },
  { name = "payout_style", type = "utf8", path = "payoutStyle" },
  { name = "settlement_style", type = "utf8", path = "settlementInformation/standardSettlementStyle" },
]

[structs.amount_schedule_nonnegative]
description = "NonNegativeAmountSchedule: initial amount, currency, and dated steps"
fields = [
  { name = "initial_value", type = "decimal", path = "initialValue" },
  { name = "currency", type = "utf8", path = "currency" },
  { name = "steps", type = "list<struct<step>>", path = "step" },
]

[structs.fx_schedule]
description = "Expiry, settlement, or fixing schedule: explicit dates or a parametric rule"
fields = [
  { name = "adjusted_dates", type = "list<date32>", path = "adjustedDate" },
  { name = "fixing_dates", type = "list<date32>", path = "fixingDate" },
  { name = "start_date", type = "date32", path = "startDate" },
  { name = "end_date", type = "date32", path = "endDate" },
  { name = "observation_frequency", type = "struct<period>", path = "observationFrequency" },
  { name = "day_type", type = "utf8", path = "dayType" },
  { name = "date_adjustments", type = "struct<business_day_adjustments>", path = "dateAdjustments" },
  { name = "number_of_fixings", type = "int64", path = "numberOfFixings" },
  { name = "final_expiry_date", type = "date32", path = "finalExpiryDate" },
  { name = "final_settlement_date", type = "date32", path = "finalSettlementDate" },
]

[structs.fx_adjusted_date]
fields = [
  { name = "adjusted_date", type = "date32", path = "adjustedDate" },
  { name = "date_adjustments", type = "struct<business_day_adjustments>", path = "dateAdjustments" },
]

[structs.fx_rate_observable]
fields = [
  { name = "id", type = "utf8", path = "@id" },
  { name = "quoted_currency_pair", type = "struct<quoted_currency_pair>", path = "quotedCurrencyPair" },
  { name = "information_source", type = "struct<information_source>", path = "informationSource" },
  { name = "cross_rate_count", type = "list<utf8>", path = "crossRate/quotedCurrencyPair/currency1" },
]

[structs.fx_region_bound]
fields = [
  { name = "condition", type = "utf8", path = "condition" },
  { name = "strike_href", type = "utf8", path = "strikeReference/@href" },
  { name = "pivot_href", type = "utf8", path = "pivotReference/@href" },
  { name = "barrier_href", type = "utf8", path = "barrierReference/@href" },
  { name = "level_href", type = "utf8", path = "levelReference/@href" },
]

[structs.fx_exchanged_currency]
fields = [
  { name = "payer_party_href", type = "utf8", path = "payerPartyReference/@href" },
  { name = "receiver_party_href", type = "utf8", path = "receiverPartyReference/@href" },
  { name = "currency", type = "utf8", path = "currency" },
]

[structs.fx_payoff_region]
description = "Accrual or target linear/constant payoff region"
fields = [
  { name = "region_type", type = "utf8", path = "#name" },
  { name = "exchanged_currency1", type = "struct<fx_exchanged_currency>", path = "exchangedCurrency1" },
  { name = "exchanged_currency2", type = "struct<fx_exchanged_currency>", path = "exchangedCurrency2" },
  { name = "strike", type = "struct<schedule>", path = "strike" },
  { name = "counter_currency_amount", type = "struct<amount_schedule_nonnegative>", path = "counterCurrencyAmount" },
  { name = "upper_bound", type = "struct<fx_region_bound>", path = "upperBound" },
  { name = "lower_bound", type = "struct<fx_region_bound>", path = "lowerBound" },
  { name = "leverage_ratio", type = "struct<schedule>", path = "leverage/ratio" },
  { name = "leverage_condition", type = "utf8", path = "leverage/condition" },
  { name = "payoff_cap_conditions", type = "list<utf8>", path = "payoffCap/condition" },
  { name = "constant_payoff_payer_href", type = "utf8", path = "payoff/payerPartyReference/@href" },
  { name = "constant_payoff_receiver_href", type = "utf8", path = "payoff/receiverPartyReference/@href" },
  { name = "physical_settlement_style", type = "utf8", path = "physicalSettlement/settlementAdjustmentStyle" },
]

[structs.fx_accrual]
fields = [
  { name = "id", type = "utf8", path = "@id" },
  { name = "observables", type = "list<struct<fx_rate_observable>>", path = "observable" },
  { name = "regions", type = "list<struct<fx_accrual_region>>", path = "accrualRegion" },
  { name = "fixing_schedule", type = "struct<fx_schedule>", path = "fixingSchedule" },
]

[structs.fx_accrual_region]
fields = [
  { name = "observable_href", type = "utf8", path = "observableReference/@href" },
  { name = "upper_bound", type = "struct<fx_region_bound>", path = "upperBound" },
  { name = "lower_bound", type = "struct<fx_region_bound>", path = "lowerBound" },
  { name = "start_date", type = "date32", path = "startDate" },
  { name = "end_date", type = "date32", path = "endDate" },
  { name = "accrual_factor", type = "struct<schedule>", path = "accrualFactor" },
]

[structs.fx_accrual_common]
description = "Notional, accrual, expiry and settlement shared by the FX accrual products"
fields = [
  { name = "notional_amount", type = "struct<amount_schedule_nonnegative>", path = "notionalAmount" },
  { name = "accrual", type = "struct<fx_accrual>", path = "accrual" },
  { name = "expiry_date", type = "struct<fx_adjusted_date>", path = "expiryDate" },
  { name = "expiry_schedule", type = "struct<fx_schedule>", path = "expirySchedule" },
  { name = "settlement_date", type = "struct<fx_adjusted_date>", path = "settlementDate" },
  { name = "settlement_schedule", type = "struct<fx_schedule>", path = "settlementSchedule" },
  { name = "barriers", type = "list<struct<fx_barrier>>", path = "barrier" },
]

