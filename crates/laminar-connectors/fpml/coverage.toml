# FpML coverage manifest. The oracle is the pinned closure: every member of the `product`
# substitution group, every loan facility and loan event representation, and every global
# element derived from `Document`. CI fails when an oracle member is missing here, and when a
# `typed` entry lacks its profile column or golden evidence. `outstanding` entries are counted
# and fail the release gate (FPML_RELEASE_GATE=1). Levels: 1 = validated ingestion with
# recoverable preservation, 2 = typed projection of the economic structure, 3 = additional
# business-rule or lifecycle interpretation (not implemented for any entry).

[closure]
artifact = "fpml-5-13-8-rec-2/confirmation"

