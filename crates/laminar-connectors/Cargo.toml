[package]
name = "laminar-connectors"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://laminardb.io/api/laminar_connectors"
description = "External system connectors for LaminarDB - Kafka, CDC, lookup tables"

[dependencies]
# Core dependencies
laminar-core = { path = "../laminar-core", version = "0.30.0" }

# Kafka
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored"], optional = true }
arrow-avro = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

# Database drivers for CDC and sinks
tokio-postgres = { version = "0.7", optional = true, features = ["with-chrono-0_4"] }
postgres-types = { version = "0.2", optional = true, features = ["with-chrono-0_4"] }
pgpq = { version = "0.11", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
pgwire-replication = { version = "=0.3.2", optional = true }
# Client-side verified TLS for PostgreSQL CDC, sink, and lookup connections.
tokio-postgres-rustls = { version = "0.13", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["aws-lc-rs", "tls12"] }
webpki-roots = { version = "1", optional = true }
# MongoDB driver (optional, for mongodb-cdc feature)
mongodb = { version = "3", optional = true }
tokio-stream = { workspace = true, optional = true }

# Delta Lake
deltalake = { workspace = true, optional = true, features = ["rustls"] }
deltalake-catalog-glue = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
url = { version = "2", optional = true }

# Apache Iceberg
iceberg = { workspace = true, optional = true }
iceberg-catalog-rest = { workspace = true, optional = true }
iceberg-storage-opendal = { workspace = true, optional = true }
uuid = { workspace = true }

# Bytes (for cache value types)
bytes = { workspace = true }
quick_cache = { workspace = true }

# Common
tokio = { workspace = true }
crossfire = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
rustc-hash = { workspace = true }

# Arrow for RecordBatch
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-ipc = { workspace = true }
arrow-row = { workspace = true, optional = true }
arrow-csv = { workspace = true }
arrow-json = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }

# Parquet lookup source (optional)
parquet = { workspace = true, optional = true, default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "lz4", "zstd"] }
object_store = { workspace = true, optional = true }
delta-reqwest = { package = "reqwest", version = "0.12", optional = true, default-features = false }
delta_kernel = { workspace = true, optional = true }

# Timestamp parsing for JSON/CSV decoders
chrono = { workspace = true }

# CSV parsing
csv = "1.3"

# Kafka discovery (optional)
tokio-util = { workspace = true, optional = true }

# WebSocket
tokio-tungstenite = { version = "0.28", features = ["native-tls"], optional = true }
tungstenite = { version = "0.28", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }

# NATS (core + JetStream)
async-nats = { version = "0.47", optional = true }
# Used by the NATS connector for RFC3339 → OffsetDateTime parsing when
# deliver.policy=by_start_time. Already pulled in transitively by
# async-nats — making the dep direct so we can name the type.
time = { version = "0.3", optional = true, features = ["parsing"] }

# OpenTelemetry OTLP/gRPC receiver
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"], optional = true }
tonic = { version = "0.14", optional = true }
base64 = { workspace = true, optional = true }

# File source/sink
globset = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[features]
default = [
    "kafka",
    "postgres-cdc",
    "postgres-sink",
    "mongodb-cdc",
    "nats",
    "delta-lake",
    "delta-lake-s3",
    "delta-lake-azure",
    "delta-lake-gcs",
    "delta-lake-unity",
    "delta-lake-glue",
    "iceberg",
    "files",
    "otel",
    "parquet-lookup",
]
testing = []
kafka = ["dep:rdkafka", "dep:arrow-avro", "dep:reqwest", "changelog-collapse"]
postgres-cdc = ["dep:tokio-postgres", "dep:pgwire-replication", "dep:deadpool-postgres", "dep:arrow-row", "dep:tokio-postgres-rustls", "dep:tokio-rustls", "dep:webpki-roots"]
postgres-sink = ["dep:tokio-postgres", "dep:postgres-types", "dep:deadpool-postgres", "dep:pgpq", "dep:futures-util", "dep:tokio-postgres-rustls", "dep:tokio-rustls", "dep:webpki-roots", "changelog-collapse"]
# MongoDB CDC source and sink
mongodb-cdc = ["dep:mongodb", "dep:tokio-stream", "dep:futures-util", "dep:arrow-row", "changelog-collapse"]
# Sink-agnostic Z-set/CDC changelog collapse for upsert sinks (pure Arrow, just
# pulls arrow-row). Kept separate from delta-lake so the helper compiles and
# tests without the deltalake stack, and so Iceberg MOR can opt in independently.
changelog-collapse = ["dep:arrow-row"]
# Delta Lake
delta-lake = ["dep:deltalake", "dep:object_store", "object_store/cloud", "dep:delta-reqwest", "dep:delta_kernel", "dep:url", "dep:datafusion", "deltalake/datafusion", "dep:tokio-util", "dep:tokio-stream", "changelog-collapse"]
delta-lake-s3 = ["delta-lake", "deltalake/s3"]
delta-lake-azure = ["delta-lake", "deltalake/azure"]
delta-lake-gcs = ["delta-lake", "deltalake/gcs"]
delta-lake-unity = ["delta-lake", "deltalake/unity-experimental", "dep:reqwest"]
delta-lake-glue = ["delta-lake", "delta-lake-s3", "deltalake/glue", "dep:deltalake-catalog-glue"]
# Apache Iceberg
iceberg = ["dep:iceberg", "dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal", "dep:tokio-stream", "dep:parquet", "dep:arrow-row"]
# Parquet schema and codec helpers (not a standalone connector)
parquet-lookup = ["dep:parquet", "dep:object_store"]
# WebSocket source and sink
websocket = ["dep:tokio-tungstenite", "dep:tungstenite", "dep:futures-util", "dep:url"]
# File source and sink (AutoLoader-style)
files = ["dep:notify", "dep:globset", "dep:object_store", "dep:parquet", "dep:libc", "dep:tokio-stream"]
# OpenTelemetry OTLP/gRPC source
otel = ["dep:opentelemetry-proto", "dep:tonic", "dep:base64"]
# NATS core + JetStream source and sink
nats = ["dep:async-nats", "dep:tokio-stream", "dep:futures-util", "dep:time"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
wiremock = "0.6"

[[bench]]
name = "json_decoder"
harness = false
