[package]
name = "state-backend-qual"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

# Qualification tooling is isolated from the LaminarDB runtime and workspace.
# Semantic adapters may compile before approval, but candidate performance, resource,
# fault, and endurance execution remains prohibited until profile and runner approval.
[workspace]

[dependencies]
jsonschema = { version = "=0.48.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
