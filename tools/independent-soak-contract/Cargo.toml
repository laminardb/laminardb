[package]
name = "independent-soak-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

# Keep this tool outside the LaminarDB workspace and dependency graph. Its
# oracle must observe public data, never implementation state.
[workspace]

[dependencies]
jsonschema = { version = "=0.48.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
